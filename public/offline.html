<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline — Saba ExploIT</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --edge: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #E11D48;
      --primary-hover: #BE123C;
      --primary-subtle: #FFE4E6;
      --primary-text: #FFFFFF;
      --icon-bg: #FEE2E2;
      --icon-stroke: #DC2626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0F19;
        --card: #151D2A;
        --edge: #27344A;
        --text: #E2E8F0;
        --text-muted: #94A3B8;
        --primary: #F43F5E;
        --primary-hover: #E11D48;
        --primary-subtle: #881337;
        --primary-text: #FFFFFF;
        --icon-bg: #450A0A;
        --icon-stroke: #EF4444;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: var(--icon-stroke);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      min-height: 44px;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--primary-text);
      background-color: var(--primary);
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
      box-shadow: 0 2px 8px -1px rgba(225, 29, 72, 0.25);
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .footer-text {
      margin-top: 1.5rem;
      margin-bottom: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Koneksi Terputus</h1>
    <p>Anda sedang offline. Silakan periksa koneksi internet Anda.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
        <path d="M16 21h5v-5"></path>
      </svg>
      Coba Muat Ulang
    </button>
    <p class="footer-text">Saba ExploIT • SMAN 1 Bantul</p>
  </div>
</body>
</html>
