  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg4)"/>
  <!-- Body/Jacket -->
  <path d="M20 95 C 20 72, 35 68, 50 68 C 65 68, 80 72, 80 95 Z" fill="#F59E0B"/>
  <rect x="46" y="68" width="8" height="27" fill="#B45309"/>
