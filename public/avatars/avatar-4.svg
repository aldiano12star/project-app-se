  <!-- Cap backwards -->
  <path d="M28 38 C 28 24, 40 22, 50 22 C 60 22, 72 24, 72 38 Z" fill="#1E293B"/>
  <rect x="25" y="36" width="50" height="6" rx="3" fill="#334155"/>
