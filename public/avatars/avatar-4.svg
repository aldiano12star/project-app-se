  <circle cx="59" cy="47" r="2.5" fill="#1E293B"/>
  <circle cx="42" cy="46" r="1" fill="#FFFFFF"/>
  <circle cx="60" cy="46" r="1" fill="#FFFFFF"/>
  <!-- Wink / Grin -->
