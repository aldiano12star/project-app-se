      <stop stop-color="#D97706"/>
      <stop offset="1" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="skin4" x1="50" y1="30" x2="50" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FED7AA"/>
      <stop offset="1" stop-color="#FDBA74"/>
